<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src blob:; media-src blob:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Lantern Court</title>
<style id="ldr">
  html,body{margin:0;height:100%;background:#1b1712;color:#fff3dc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center}
  h1{margin:0;font-weight:600;font-size:24px}
  input{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid #6b5a3c;background:#2a231a;color:#fff3dc;width:min(320px,86vw);box-sizing:border-box}
  button{font:inherit;color:#2b2113;background:#ffd98a;border:0;border-radius:999px;padding:12px 26px;font-size:17px;font-weight:600}
  button[disabled]{opacity:.5}
  #msg{min-height:1.4em;font-size:14px;opacity:.9}
  #bar{width:min(320px,86vw);height:6px;background:#2a231a;border-radius:3px;overflow:hidden;display:none}
  #bar i{display:block;height:100%;width:0;background:#ffd98a}
</style>
</head>
<body>
<main id="gate">
  <h1>Lantern Court</h1>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="passphrase" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password" required>
    <p><button id="go" type="submit">Open</button></p>
  </form>
  <div id="bar"><i></i></div>
  <div id="msg"></div>
</main>
<script type="module" src="./loader.js"></script>
</body>
</html>
